start_1: "<blockquote expandable>{0} نشط الآن.\n\n<b>✫ وقت التشغيل :</b> {1}</blockquote>"
start_2: "<blockquote expandable>مرحبًا، {0} \nأنا {1},\n\n┏━━━━━━━━━━━━━━━━━⧫\n┠ ◆ لدي ميزات خاصة.\n┠ ◆ بوت الكل في واحد.\n┗━━━━━━━━━━━━━━━━━⧫\n┏━━━━━━━━━━━━━━━━━⧫\n┠ ◆ يمكنك تشغيل الأغاني في مكالمات الصوت.\n┠ ◆ يمكنك توليد الصور.\n┠ ◆ يمكنك الترجمة إلى عدة لغات.\n┠ ◆ يمكنني كتم، إلغاء كتم، حظر، رفع الحظر، طرد...\n┠ ◆ ترحيب خاص\n┠ ◆ المزيد من الميزات اضغط على زر الأوامر...\n┗━━━━━━━━━━━━━━━━━⧫\n๏ اضغط على زر المساعدة للحصول على معلومات حول وحداتي وأوامري.\n\n🫧 المطور 🪽 ➪ <a href='https://t.me/Lord_Vasudev_Krishna'>مبرمج معتمد ✔︎</a></blockquote>"
start_3: "<blockquote expandable>مرحبًا {0},\nهذا هو {1}\n\nشكرًا لإضافتي إلى {2}، {3} يمكنه الآن تشغيل الأغاني في هذه الدردشة.</blockquote>"
start_4: "<blockquote expandable>🎄 <b>مطلوب مجموعة فائقة</b> 🎄\n\nيرجى تحويل <b>المجموعة</b> الخاصة بك إلى <b>مجموعة فائقة</b> ثم أضفني مجددًا.\n\n<b>كيف تجعلها مجموعة فائقة؟</b>\n- اجعل سجل الدردشة في مجموعتك <b>مرئي</b> مرة واحدة.</blockquote>"
start_5: "<blockquote expandable><b>↝ مجموعة محظورة ↜</b>\n\nهذه المجموعة محظورة على قاعدة بيانات {0}.\nاطلب من <a href={1}>المستخدم الجذري</a> إزالة الحظر عن مجموعتك أو زر <a href={2}>دردشة الدعم.</a></blockquote>"
start_6: "<blockquote expandable>😲 <b>معلومات المقطع</b> 😲\n\n📌 <b>العنوان :</b> {0}\n\n⏳ <b>المدة :</b> {1} دقيقة\n👀 <b>المشاهدات :</b> <code>{2}</code>\n⏰ <b>تم النشر في :</b> {3}\n📎 <b>القناة :</b> <a href={4}>{5}</a>\n\n<u><b>🥀 البحث بواسطة {6}</b></u></blockquote>"

